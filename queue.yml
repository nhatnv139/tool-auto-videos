    goc_nhin: "Ong khong giet cong than vi tu ti xuat than. Ong da nhin ca nha chet doi vi nha nuoc khong hoat dong, nen coi moi vet nut la de sap vo"
    do_dai: 19
    no_ai: true
    anh: full
    # 3495 am tiet | 100 marker | 11,2s/anh | 7 ngat chuong

